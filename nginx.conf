# Nginx Configuration for spryclips.com
# TikTok Clone - Production Setup
# File: /etc/nginx/sites-available/spryclips.com

server {
    listen 80;
    listen [::]:80;
    server_name spryclips.com www.spryclips.com;

    # Redirect HTTP to HTTPS (uncomment when SSL is ready)
    # return 301 https://$server_name$request_uri;
}

server {
    # SSL Configuration (uncomment and configure when ready)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/spryclips.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/spryclips.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    listen 80;  # Remove this when SSL is enabled
    server_name spryclips.com www.spryclips.com;

    # Increase upload size limit for videos (100MB)
    client_max_body_size 100M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # Logging
    access_log /var/log/nginx/spryclips_access.log;
    error_log /var/log/nginx/spryclips_error.log;

    # ========================================
    # PUBLIC UPLOADS DIRECTORY
    # ========================================
    # Serve uploaded files directly from public directory
    # This bypasses Node.js for better performance
    location /uploads/ {
        alias /home/reactmaster/uploads/;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Cache control for static files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Enable CORS for video/image loading
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        
        # Handle OPTIONS requests for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        
        # Disable access log for uploads (optional, for performance)
        access_log off;
        
        # Allow all file types
        types {
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            video/x-msvideo avi;
            video/x-matroska mkv;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            application/pdf pdf;
        }
    }

    # ========================================
    # PROCESSED VIDEOS (thumbnails, etc.)
    # ========================================
    location /uploads/processed/ {
        alias /home/reactmaster/uploads/processed/;
        
        # Cache control
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        
        access_log off;
    }

    # ========================================
    # BACKEND API PROXY
    # ========================================
    # Proxy /api requests to Node.js backend
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for large uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ========================================
    # SOCKET.IO / WEBSOCKET
    # ========================================
    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ========================================
    # API DOCUMENTATION
    # ========================================
    location /api-docs {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================
    # FRONTEND STATIC FILES
    # ========================================
    # Serve React app from build directory
    location / {
        root /home/reactmaster/Tiktok_clone/frontend/build;
        try_files $uri $uri/ /index.html;
        
        # Cache control for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # No cache for index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # ========================================
    # SECURITY HEADERS
    # ========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Content Security Policy (adjust as needed)
    # add_header Content-Security-Policy "default-src 'self' https://spryclips.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # ========================================
    # ROBOTS & SITEMAP
    # ========================================
    location = /robots.txt {
        root /home/reactmaster/Tiktok_clone/frontend/build;
        access_log off;
    }
    
    location = /sitemap.xml {
        root /home/reactmaster/Tiktok_clone/frontend/build;
        access_log off;
    }

    # ========================================
    # DENY ACCESS TO HIDDEN FILES
    # ========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========================================
    # ERROR PAGES
    # ========================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
