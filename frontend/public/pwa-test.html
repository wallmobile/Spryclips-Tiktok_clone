<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test - SpryClips</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f9fafb;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #60A5FA;
            margin-top: 0;
        }
        h2 {
            color: #1f2937;
            font-size: 1.25rem;
            margin-top: 0;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        .status-icon.success { background: #10b981; }
        .status-icon.error { background: #ef4444; }
        .status-icon.warning { background: #f59e0b; }
        button {
            background: #60A5FA;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #3b82f6;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .log {
            background: #1f2937;
            color: #10b981;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-entry {
            margin: 4px 0;
        }
        .log-error { color: #ef4444; }
        .log-success { color: #10b981; }
        .log-info { color: #60A5FA; }
    </style>
</head>
<body>
    <h1>🚀 SpryClips PWA Test Dashboard</h1>
    
    <div class="card">
        <h2>Service Worker Status</h2>
        <div id="sw-status"></div>
        <button onclick="checkServiceWorker()">Refresh Status</button>
        <button onclick="unregisterSW()">Unregister SW</button>
        <button onclick="updateSW()">Update SW</button>
    </div>

    <div class="card">
        <h2>Cache Status</h2>
        <div id="cache-status"></div>
        <button onclick="checkCaches()">Check Caches</button>
        <button onclick="clearAllCaches()">Clear All Caches</button>
    </div>

    <div class="card">
        <h2>Manifest & Icons</h2>
        <div id="manifest-status"></div>
        <button onclick="checkManifest()">Check Manifest</button>
    </div>

    <div class="card">
        <h2>Actions</h2>
        <button onclick="testNotification()">Test Notification</button>
        <button onclick="goOffline()">Test Offline Mode</button>
        <button onclick="clearEverything()">Clear Everything & Reload</button>
    </div>

    <div class="card">
        <h2>Console Log</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        }

        async function checkServiceWorker() {
            const statusDiv = document.getElementById('sw-status');
            statusDiv.innerHTML = '';
            
            if (!('serviceWorker' in navigator)) {
                statusDiv.innerHTML = '<div class="status"><div class="status-icon error"></div>Service Worker not supported</div>';
                log('Service Worker not supported', 'error');
                return;
            }

            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                log(`Found ${registrations.length} service worker(s)`, 'success');
                
                registrations.forEach((reg, index) => {
                    const state = reg.active ? reg.active.state : 'none';
                    const url = reg.active ? reg.active.scriptURL : 'N/A';
                    statusDiv.innerHTML += `
                        <div class="status">
                            <div class="status-icon ${state === 'activated' ? 'success' : 'warning'}"></div>
                            <div>
                                <strong>Registration ${index + 1}:</strong> ${state}<br>
                                <small>${url}</small>
                            </div>
                        </div>
                    `;
                });

                if (registrations.length === 0) {
                    statusDiv.innerHTML = '<div class="status"><div class="status-icon warning"></div>No service workers registered</div>';
                }
            } catch (error) {
                log(`Error checking service workers: ${error.message}`, 'error');
                statusDiv.innerHTML = `<div class="status"><div class="status-icon error"></div>Error: ${error.message}</div>`;
            }
        }

        async function unregisterSW() {
            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const reg of registrations) {
                    await reg.unregister();
                }
                log(`Unregistered ${registrations.length} service worker(s)`, 'success');
                checkServiceWorker();
            } catch (error) {
                log(`Error unregistering: ${error.message}`, 'error');
            }
        }

        async function updateSW() {
            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const reg of registrations) {
                    await reg.update();
                }
                log('Service worker update triggered', 'success');
                checkServiceWorker();
            } catch (error) {
                log(`Error updating: ${error.message}`, 'error');
            }
        }

        async function checkCaches() {
            const statusDiv = document.getElementById('cache-status');
            statusDiv.innerHTML = '';
            
            if (!('caches' in window)) {
                statusDiv.innerHTML = '<div class="status"><div class="status-icon error"></div>Cache API not supported</div>';
                log('Cache API not supported', 'error');
                return;
            }

            try {
                const cacheNames = await caches.keys();
                log(`Found ${cacheNames.length} cache(s)`, 'success');
                
                for (const name of cacheNames) {
                    const cache = await caches.open(name);
                    const keys = await cache.keys();
                    statusDiv.innerHTML += `
                        <div class="status">
                            <div class="status-icon success"></div>
                            <div>
                                <strong>${name}:</strong> ${keys.length} items
                            </div>
                        </div>
                    `;
                }

                if (cacheNames.length === 0) {
                    statusDiv.innerHTML = '<div class="status"><div class="status-icon warning"></div>No caches found</div>';
                }
            } catch (error) {
                log(`Error checking caches: ${error.message}`, 'error');
                statusDiv.innerHTML = `<div class="status"><div class="status-icon error"></div>Error: ${error.message}</div>`;
            }
        }

        async function clearAllCaches() {
            try {
                const cacheNames = await caches.keys();
                for (const name of cacheNames) {
                    await caches.delete(name);
                }
                log(`Cleared ${cacheNames.length} cache(s)`, 'success');
                checkCaches();
            } catch (error) {
                log(`Error clearing caches: ${error.message}`, 'error');
            }
        }

        async function checkManifest() {
            const statusDiv = document.getElementById('manifest-status');
            statusDiv.innerHTML = '';
            
            try {
                const response = await fetch('/manifest.json');
                const manifest = await response.json();
                log('Manifest loaded successfully', 'success');
                
                statusDiv.innerHTML = `
                    <div class="status">
                        <div class="status-icon success"></div>
                        <div>
                            <strong>Name:</strong> ${manifest.name}<br>
                            <strong>Short Name:</strong> ${manifest.short_name}<br>
                            <strong>Icons:</strong> ${manifest.icons.length}
                        </div>
                    </div>
                `;

                manifest.icons.forEach((icon, index) => {
                    const img = new Image();
                    img.onload = () => {
                        log(`Icon ${index + 1} (${icon.sizes}) loaded successfully`, 'success');
                    };
                    img.onerror = () => {
                        log(`Icon ${index + 1} (${icon.sizes}) failed to load: ${icon.src}`, 'error');
                    };
                    img.src = icon.src;
                });
            } catch (error) {
                log(`Error loading manifest: ${error.message}`, 'error');
                statusDiv.innerHTML = `<div class="status"><div class="status-icon error"></div>Error: ${error.message}</div>`;
            }
        }

        async function testNotification() {
            if (!('Notification' in window)) {
                log('Notifications not supported', 'error');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                new Notification('SpryClips Test', {
                    body: 'PWA notifications are working!',
                    icon: '/favicon.ico'
                });
                log('Test notification sent', 'success');
            } else {
                log('Notification permission denied', 'error');
            }
        }

        async function goOffline() {
            log('Simulating offline mode...', 'info');
            log('Open DevTools > Network tab and set to "Offline"', 'info');
            log('Then try navigating or refreshing the page', 'info');
        }

        async function clearEverything() {
            try {
                await unregisterSW();
                await clearAllCaches();
                log('Cleared everything! Reloading in 2 seconds...', 'success');
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            log('PWA Test Dashboard loaded', 'info');
            checkServiceWorker();
            checkCaches();
            checkManifest();
        });

        // Listen for service worker updates
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                log('Service worker controller changed', 'info');
                checkServiceWorker();
            });
        }
    </script>
</body>
</html>
